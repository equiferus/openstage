name: Label suggestions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/label-suggestions.yml
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create automation labels
        uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              {
                name: 'suggestion: concert',
                color: 'd97706',
                description: 'A concert proposed for the Openstage collection',
              },
              {
                name: 'suggestion: feature',
                color: '8b5cf6',
                description: 'A proposed improvement to the Openstage app',
              },
              { name: 'automation: claimed', color: '1d76db', description: 'Claimed by an automation worker' },
              { name: 'automation: failed', color: 'b60205', description: 'Automation stopped and requires attention' },
              { name: 'pm: reviewing', color: 'fbca04', description: 'Under autonomous product review' },
              { name: 'pm: rejected', color: 'd93f0b', description: 'Rejected during product review' },
              { name: 'pm: needs-human-review', color: 'e99695', description: 'Requires a human product decision' },
              { name: 'ready-for-production', color: '0e8a16', description: 'Approved and ready for implementation' },
              { name: 'implementation: working', color: '0052cc', description: 'Being implemented by automation' },
              { name: 'implementation: pr-opened', color: '5319e7', description: 'Implementation pull request is open' },
              { name: 'implementation: changes-requested', color: 'd4c5f9', description: 'Returned to an implementation worker by the PM' },
              { name: 'implementation: blocked', color: 'b60205', description: 'Implementation is blocked' },
              { name: 'implementation: merged', color: '6f42c1', description: 'Autonomously reviewed and merged by the PM' },
              { name: 'pm: delivery-review', color: 'fbca04', description: 'Under autonomous PM delivery review' },
              { name: 'curation: rejected', color: 'd93f0b', description: 'Concert suggestion did not pass curation' },
              { name: 'curation: needs-info', color: 'fbca04', description: 'Concert suggestion needs more information' },
            ]

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                })
              } catch (error) {
                if (error.status !== 422) throw error
              }
            }

  route-issue:
    if: github.event_name == 'issues' && (startsWith(github.event.issue.title, '[Concert]:') || startsWith(github.event.issue.title, '[Feature]:'))
    needs: ensure-labels
    runs-on: ubuntu-latest
    steps:
      - name: Apply suggestion label
        uses: actions/github-script@v9
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          script: |
            const label = process.env.ISSUE_TITLE.startsWith('[Concert]:')
              ? 'suggestion: concert'
              : 'suggestion: feature'

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            })
