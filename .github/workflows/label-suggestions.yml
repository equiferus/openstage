name: Label suggestions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/label-suggestions.yml
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create suggestion labels
        uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              {
                name: 'suggestion: concert',
                color: 'd97706',
                description: 'A concert proposed for the Openstage collection',
              },
              {
                name: 'suggestion: feature',
                color: '8b5cf6',
                description: 'A proposed improvement to the Openstage app',
              },
            ]

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                })
              } catch (error) {
                if (error.status !== 422) throw error
              }
            }

  route-issue:
    if: github.event_name == 'issues' && (startsWith(github.event.issue.title, '[Concert]:') || startsWith(github.event.issue.title, '[Feature]:'))
    needs: ensure-labels
    runs-on: ubuntu-latest
    steps:
      - name: Apply suggestion label
        uses: actions/github-script@v9
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          script: |
            const label = process.env.ISSUE_TITLE.startsWith('[Concert]:')
              ? 'suggestion: concert'
              : 'suggestion: feature'

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            })
