<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Openstage is a community-curated index of exceptional live concert recordings and setlists."
    />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:title" content="Openstage — remarkable concerts, one stage" />
    <meta
      property="og:description"
      content="Watch full live performances, explore their setlists, and follow every recording to its original source."
    />
    <meta property="og:type" content="website" />
    <title>Openstage — remarkable concerts, one stage</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("openstage:theme")
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          var root = document.documentElement
          root.dataset.theme = theme
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", theme === "light" ? "#fafaf9" : "#09090b")
        } catch (error) {
          // Ignore storage errors and fall back to the default dark palette.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/routes/main.tsx"></script>
  </body>
</html>
